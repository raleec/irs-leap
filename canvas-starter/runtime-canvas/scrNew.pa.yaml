Screens:
  scrNew:
    Properties:
      Fill: =RGBA(247, 249, 252, 1)
      OnVisible: |-
        =If(varNewRequest,
          Reset(txtTitle); Reset(txtDescription); Reset(dpLeave); Reset(txtHours);
          Reset(ddCategory); Reset(cbApprover1); Reset(cbApprover2); Reset(cbApprover3);
          Reset(ddStartHour); Reset(ddStartMinute); Reset(ddEndHour); Reset(ddEndMinute);
          Set(varRequestError, ""); Set(varSubmitting, false); Set(varNewRequest, false))
    Children:
      - lblNewHeading:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =26
            TabIndex: =0
            Text: ="New leave or exception request"
            Width: =900
            X: =24
            Y: =12
      - lblNewHelp:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =38
            TabIndex: =0
            Text: ="One date and one category per request. Overlaps are allowed. Do not include diagnoses or unnecessary personal details."
            Width: =1300
            X: =24
            Y: =66
      - lblTitle:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Short title *"
            Width: =600
            X: =24
            Y: =116
      - txtTitle:
          Control: Classic/TextInput
          Properties:
            AccessibleLabel: ="Required short request title"
            Default: =""
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            MaxLength: =120
            Width: =620
            X: =24
            Y: =150
      - lblDescription:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Brief description"
            Width: =600
            X: =24
            Y: =206
      - txtDescription:
          Control: Classic/TextInput
          Properties:
            AccessibleLabel: ="Optional brief description. Do not include medical details."
            Default: =""
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =98
            MaxLength: =1000
            Mode: =TextMode.MultiLine
            Width: =620
            X: =24
            Y: =240
      - lblLeaveDate:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Leave date *"
            Width: =300
            X: =24
            Y: =350
      - dpLeave:
          Control: Classic/DatePicker
          Properties:
            AccessibleLabel: ="Required calendar date of leave"
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            EndYear: =2100
            Height: =42
            StartYear: =1900
            Width: =300
            X: =24
            Y: =386
      - lblHours:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Leave hours (optional integer, 0-24)"
            Width: =300
            X: =344
            Y: =350
      - txtHours:
          Control: Classic/TextInput
          Properties:
            AccessibleLabel: ="Optional whole-number leave hours from zero through twenty-four"
            Default: =""
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Format: =TextFormat.Number
            Height: =42
            HintText: ="Blank means not entered; 0 means zero"
            Width: =300
            X: =344
            Y: =386
      - lblStart:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Start time * (24-hour local time)"
            Width: =300
            X: =24
            Y: =444
      - ddStartHour:
          Control: Classic/DropDown
          Properties:
            AccessibleLabel: ="Start hour, zero through twenty-three"
            Default: ="9"
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            Items: =Sequence(24, 0, 1)
            Items.Value: =Value
            Width: =130
            X: =24
            Y: =480
      - ddStartMinute:
          Control: Classic/DropDown
          Properties:
            AccessibleLabel: ="Start minute"
            Default: ="0"
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            Items: =Sequence(60, 0, 1)
            Items.Value: =Value
            Width: =130
            X: =172
            Y: =480
      - lblEnd:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="End time * (24:00 = end of day)"
            Width: =300
            X: =344
            Y: =444
      - ddEndHour:
          Control: Classic/DropDown
          Properties:
            AccessibleLabel: ="End hour, zero through twenty-four"
            Default: ="10"
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            Items: =Sequence(25, 0, 1)
            Items.Value: =Value
            Width: =130
            X: =344
            Y: =480
      - ddEndMinute:
          Control: Classic/DropDown
          Properties:
            AccessibleLabel: ="End minute; only zero is allowed at hour twenty-four"
            Default: ="0"
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            Items: =Sequence(If(ddEndHour.Selected.Value = 24, 1, 60), 0, 1)
            Items.Value: =Value
            Width: =130
            X: =492
            Y: =480
      - lblCategory:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Request category *"
            Width: =620
            X: =700
            Y: =116
      - ddCategory:
          Control: Classic/DropDown
          Properties:
            AccessibleLabel: ="Required leave or exception category"
            AllowEmptySelection: =true
            Default: =Blank()
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            Items: =Choices('LEAP Requests'.'Leave Category')
            Items.Value: =Value
            Width: =620
            X: =700
            Y: =150
      - lblApprover1:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Approver 1 *"
            Width: =620
            X: =700
            Y: =206
      - cbApprover1:
          Control: ModernCombobox
          Properties:
            AccessibleLabel: ="Required first approver"
            DelayOutput: =true
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            InputTextPlaceholder: ="Search your organization's directory"
            ItemDisplayText: =ThisItem.DisplayName & " (" & ThisItem.UserPrincipalName & ")"
            Items: |-
              =Filter(Office365Users.SearchUserV2({searchTerm: Trim(cbApprover1.SearchText), top: 25, isSearchTermRequired: true}).value, AccountEnabled = true, Lower(Id) <> Lower(Text(User().EntraObjectId)))
            OnChange: =Set(varRequestError, "")
            SelectMultiple: =false
            Width: =620
            X: =700
            Y: =240
      - lblApprover2:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Approver 2 (optional)"
            Width: =620
            X: =700
            Y: =300
      - cbApprover2:
          Control: ModernCombobox
          Properties:
            AccessibleLabel: ="Optional second approver"
            DelayOutput: =true
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            InputTextPlaceholder: ="Optional second approver"
            ItemDisplayText: =ThisItem.DisplayName & " (" & ThisItem.UserPrincipalName & ")"
            Items: |-
              =Filter(Office365Users.SearchUserV2({searchTerm: Trim(cbApprover2.SearchText), top: 25, isSearchTermRequired: true}).value, AccountEnabled = true, Lower(Id) <> Lower(Text(User().EntraObjectId)))
            OnChange: =Set(varRequestError, "")
            SelectMultiple: =false
            Width: =620
            X: =700
            Y: =334
      - lblApprover3:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =30
            TabIndex: =0
            Text: ="Approver 3 (optional)"
            Width: =620
            X: =700
            Y: =394
      - cbApprover3:
          Control: ModernCombobox
          Properties:
            AccessibleLabel: ="Optional third approver"
            DelayOutput: =true
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =42
            InputTextPlaceholder: ="Optional third approver"
            ItemDisplayText: =ThisItem.DisplayName & " (" & ThisItem.UserPrincipalName & ")"
            Items: |-
              =Filter(Office365Users.SearchUserV2({searchTerm: Trim(cbApprover3.SearchText), top: 25, isSearchTermRequired: true}).value, AccountEnabled = true, Lower(Id) <> Lower(Text(User().EntraObjectId)))
            OnChange: =Set(varRequestError, "")
            SelectMultiple: =false
            Width: =620
            X: =700
            Y: =428
      - lblApprovalHelp:
          Control: Label
          Properties:
            FocusedBorderThickness: =2
            Height: =72
            TabIndex: =0
            Text: ="Search your organization's directory. Each selected person must also be an enabled, provisioned Dataverse user. Up to three distinct approvers; first response decides. Submitted requests cannot be edited."
            Width: =620
            X: =700
            Y: =490
      - lblSubmissionError:
          Control: Label
          Properties:
            Color: =RGBA(170, 25, 25, 1)
            FocusedBorderThickness: =2
            Height: =72
            TabIndex: =0
            Text: =varRequestError
            Width: =1296
            X: =24
            Y: =576
      - btnSubmit:
          Control: Classic/Button
          Properties:
            DisplayMode: =If(varSubmitting || IsBlank(varMe.User), DisplayMode.Disabled, DisplayMode.Edit)
            Height: =46
            OnSelect: |-
              =Set(varRequestError, "");
              With(
                {h: Trim(txtHours.Text), s: ddStartHour.Selected.Value * 60 + ddStartMinute.Selected.Value, e: If(ddEndHour.Selected.Value = 24, 1440, ddEndHour.Selected.Value * 60 + ddEndMinute.Selected.Value)},
                If(
                  IsBlank(varMe.User), Set(varRequestError, "Your Dataverse user is unavailable."),
                  IsBlank(Trim(txtTitle.Text)), Set(varRequestError, "Enter a short title."),
                  IsBlank(dpLeave.SelectedDate), Set(varRequestError, "Select one leave date."),
                  IsBlank(ddCategory.Selected.Value), Set(varRequestError, "Select one category."),
                  IsBlank(cbApprover1.Selected.Id), Set(varRequestError, "Choose Approver 1."),
                  !IsBlank(h) && !IsMatch(h, "([0-9]|1[0-9]|2[0-4])", MatchOptions.Complete), Set(varRequestError, "Hours must be blank or an integer from 0 to 24."),
                  e <= s, Set(varRequestError, "End time must be later on the same date."),
                  Lower(cbApprover1.Selected.Id) = Lower(Text(User().EntraObjectId)) ||
                  (!IsBlank(cbApprover2.Selected.Id) && Lower(cbApprover2.Selected.Id) = Lower(Text(User().EntraObjectId))) ||
                  (!IsBlank(cbApprover3.Selected.Id) && Lower(cbApprover3.Selected.Id) = Lower(Text(User().EntraObjectId))), Set(varRequestError, "Self-approval is not permitted."),
                  (!IsBlank(cbApprover2.Selected.Id) && Lower(cbApprover2.Selected.Id) = Lower(cbApprover1.Selected.Id)) ||
                  (!IsBlank(cbApprover3.Selected.Id) && (Lower(cbApprover3.Selected.Id) = Lower(cbApprover1.Selected.Id) || Lower(cbApprover3.Selected.Id) = Lower(cbApprover2.Selected.Id))), Set(varRequestError, "Choose distinct approvers."),
                  Set(varSubmitting, true);
                  IfError(
                    With(
                      {
                        a1: LookUp(Users, 'Azure AD Object ID' = GUID(cbApprover1.Selected.Id), ThisRecord),
                        a2: If(!IsBlank(cbApprover2.Selected.Id), LookUp(Users, 'Azure AD Object ID' = GUID(cbApprover2.Selected.Id), ThisRecord)),
                        a3: If(!IsBlank(cbApprover3.Selected.Id), LookUp(Users, 'Azure AD Object ID' = GUID(cbApprover3.Selected.Id), ThisRecord))
                      },
                      If(
                        IsBlank(a1.User) ||
                        (!IsBlank(cbApprover2.Selected.Id) && IsBlank(a2.User)) ||
                        (!IsBlank(cbApprover3.Selected.Id) && IsBlank(a3.User)),
                        Set(varSubmitting, false); Set(varRequestError, "Every selected approver must be provisioned in this Dataverse environment. No request was saved."),
                        a1.Status <> 'Status (Users)'.Enabled || a1.'Access Mode' <> 'Access Mode (Users)'.'Read-Write' ||
                        (!IsBlank(a2.User) && (a2.Status <> 'Status (Users)'.Enabled || a2.'Access Mode' <> 'Access Mode (Users)'.'Read-Write')) ||
                        (!IsBlank(a3.User) && (a3.Status <> 'Status (Users)'.Enabled || a3.'Access Mode' <> 'Access Mode (Users)'.'Read-Write')),
                        Set(varSubmitting, false); Set(varRequestError, "Every selected approver must be enabled with Read-Write access in Dataverse. No request was saved."),
                        Set(varSelectedRequest, Patch('LEAP Requests', Defaults('LEAP Requests'),
                          {Title: Trim(txtTitle.Text), Description: txtDescription.Text, 'Leave Date': dpLeave.SelectedDate,
                           'Start Minute': s, 'End Minute': e, 'Leave Hours': If(IsBlank(h), Blank(), Value(h)),
                           'Leave Category': ddCategory.Selected.Value,
                           'Approver 1': a1, 'Approver 2': a2, 'Approver 3': a3}));
                        Set(varSubmitting, false); Refresh('LEAP Requests'); Notify("Request submitted.", NotificationType.Success); Navigate(scrDetails)
                      )
                    ),
                    Set(varSubmitting, false); Set(varRequestError, FirstError.Message)
                  )
                )
              )
            Text: =If(varSubmitting, "Submitting...", "Submit request")
            Width: =310
            X: =1010
            Y: =680
      - btnCancel:
          Control: Classic/Button
          Properties:
            DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =46
            OnSelect: =Navigate(scrCalendar)
            Text: ="Cancel"
            Width: =240
            X: =700
            Y: =680
